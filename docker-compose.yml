# === Stack jarvis ===
# Despliegue: desde el directorio del stack en el servidor
#   docker compose up -d --build
#
# network_mode: host es IMPRESCINDIBLE para el descubrimiento de Google Cast (mDNS
# multicast). Con host-net, la directiva `ports:` se ignora: la API queda publicada
# directamente en el host en JARVIS_PORT (8200 por defecto; cámbialo en .env).
services:
  jarvis:
    build: .
    container_name: jarvis
    network_mode: host
    restart: unless-stopped
    env_file: .env
    environment:
      # Zona horaria local del proceso: el núcleo inyecta datetime.now() en cada
      # prompt para que Jarvis sepa la hora. Sin esto el contenedor corre en UTC.
      # Requiere tzdata en la imagen (instalado en el Dockerfile).
      TZ: ${TZ:-Europe/Madrid}
      # La API escucha en todas las interfaces del host, en el puerto del stack.
      # El puerto sale del .env (interpolación de compose) para poder cambiarlo
      # sin tocar este fichero; el healthcheck y el satélite usan el mismo valor.
      JARVIS_HOST: 0.0.0.0
      JARVIS_PORT: ${JARVIS_PORT:-8200}
      # STT server-side (CPU i7-8809G = 4 núcleos / 8 hilos, sin GPU).
      # Historial: `small` → `medium` (2026-06-25, mejor calidad ES, coste CPU
      # asumible) → `large-v3-turbo` (2026-07-02, prueba) → `medium` (2026-07-02,
      # revertido). Medición en vivo de turbo en esta CPU: STT fijo ~9.2s, RTF
      # 2.5–3.4x, frente al baseline de medium (~1.7–1.9x) → turbo es ~3–4s más
      # lento por turno. El encoder pesado de large-v3 gana al decoder podado sin
      # GPU. medium es el mejor compromiso calidad/latencia en este NUC.
      # Configurable desde .env; si se cambia a uno mayor, revisar JARVIS_MEM_LIMIT.
      JARVIS_STT_MODEL: ${JARVIS_STT_MODEL:-medium}
      # Caché de modelos de HuggingFace (faster-whisper descarga el modelo al
      # primer uso). Apunta al volumen persistente para no re-descargar en cada
      # rebuild de la imagen.
      HF_HOME: /app/cache/huggingface
      # BD SQLite del scheduler de recordatorios, en volumen persistente para que
      # los avisos programados sobrevivan a reinicios/rebuilds del contenedor.
      JARVIS_REMINDERS_DB: /app/data/reminders.sqlite
      # Token cacheado de Spotify, en el volumen persistente (jarvis-data). El
      # fichero se genera en local con scripts/spotify_auth.py y se copia aquí.
      SPOTIFY_CACHE: /app/data/spotify-cache
    volumes:
      # Persiste el modelo Whisper descargado entre rebuilds (~1.5 GB para medium).
      - jarvis-models:/app/cache
      # Persiste datos de capacidades (BD de recordatorios; cache de Spotify futura).
      - jarvis-data:/app/data
    # Tope de RAM del contenedor. Sin él, cargar Whisper en un host justo de
    # memoria no provoca un OOM limpio sino thrashing que congela la máquina entera
    # (incidente 2026-10-06: dos Whisper medium a la vez colgaron el LXC). Con el
    # tope, lo peor es que el kernel mate y reinicie este contenedor.
    # memswap_limit = mem_limit → sin swap (evita el mismo thrashing vía swap).
    # Medido con medium (2026-10-06): ~2,0 GB el proceso con Whisper+Piper cargados,
    # +~0,35 GB por cada sesión abierta (CLI de Claude); con la web (texto + voz)
    # roza 3 GB y con 3g llegó a reiniciarse → 4g. Modelos mayores: subirlo.
    mem_limit: ${JARVIS_MEM_LIMIT:-4g}
    memswap_limit: ${JARVIS_MEM_LIMIT:-4g}
    healthcheck:
      # urllib en lugar de curl para no instalar binarios extra en la imagen.
      # Lee JARVIS_PORT del entorno del contenedor (no hay shell que expanda $VAR).
      test: ["CMD", "python", "-c", "import os,urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('JARVIS_PORT','8200')).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      # Red de seguridad: un bug de reconexión en la capacidad Cast llenó el log
      # a 9+ GB y con ello el disco del NUC entero (2026-07-03/04). Con esto, un
      # futuro bucle de errores queda acotado a 50 MB en vez de tirar el host.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Satélite de voz ambiente (Hito 3.5+4): captura de la PS Eye + (Fase 3) wake
  # word, hablando el protocolo /voice del núcleo. Sin healthcheck a propósito —
  # deploy.sh solo espera la salud del contenedor `jarvis`, no de este.
  jarvis-satellite:
    build:
      context: .
      dockerfile: Dockerfile.satellite
    container_name: jarvis-satellite
    network_mode: host          # habla al núcleo por 127.0.0.1:JARVIS_PORT (host-net)
    # Fase 3: servicio permanente (modo `run`, wake word) → se reinicia solo.
    restart: unless-stopped
    depends_on:
      - jarvis
    devices:
      - /dev/snd:/dev/snd       # PS Eye vía passthrough del LXC (Fase 0)
    environment:
      # Fase 3: máquina de estados con wake word ("Hey Jarvis" → captura → Cast).
      # Para revalidar el pipe sin wake usar JARVIS_SAT_MODE: test-once.
      JARVIS_SAT_MODE: run
      JARVIS_SAT_WS_URL: ws://127.0.0.1:${JARVIS_PORT:-8200}/voice
      JARVIS_SAT_CAST_DEVICE: Salón
      JARVIS_SAT_INPUT_DEVICE: Camera    # substring del device de la PS Eye (PortAudio: "USB Camera-B4.09.24.1")
      # Ganancia software SOLO para wake/VAD (los detectores). La PS Eye entrega
      # RMS ~0.01 y sin amplificar el wake se queda en ~0.1. Se aplica en main.py
      # aguas abajo; el audio que va al STT sigue CRUDO (amplificarlo lo clippea y
      # Whisper transcribe basura). x12 sube el wake a ~0.30-0.40. Tunable.
      JARVIS_SAT_INPUT_GAIN: "12"
      # Umbrales del wake/VAD ajustados por voz (2026-07-02): la PS Eye capta flojo
      # a distancia de salón (RMS ~0.01), así que se bajan respecto al default:
      #   - wake 0.5 -> 0.3 (con ganancia x12 los "Hey Jarvis" claros dan ~0.30-0.34)
      #   - VAD  0.5 -> 0.3 (a 0.5 no detectaba la voz lejana y la captura no
      #     cerraba por silencio, aguantando el timeout de 8 s)
      JARVIS_SAT_WAKE_THRESHOLD: "0.3"
      JARVIS_SAT_VAD_THRESHOLD: "0.3"
      # JARVIS_SAT_WAKE_THRESHOLD_SPEAKING: "0.7"  # barge-in, default en código
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Worker de agentes (Hito 9): ejecuta agentes de Claude en segundo plano,
  # aislado del núcleo. Opcional: perfil "agents" →
  #   docker compose --profile agents up -d --build jarvis-worker
  # Los bare repos permitidos se montan en /repos desde el
  # docker-compose.override.yml (ver docker-compose.override.example.yml).
  jarvis-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: jarvis-worker
    profiles: ["agents"]
    restart: unless-stopped
    # Sin env_file a propósito: el .env del núcleo lleva tokens (HA, ntfy…) que
    # los agentes no deben ver. Solo pasan estas variables.
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      JARVIS_WORKER_TOKEN: ${JARVIS_WORKER_TOKEN:-}
      JARVIS_AGENT_REPOS: ${JARVIS_AGENT_REPOS:-}
      JARVIS_AGENTS_MAX: ${JARVIS_AGENTS_MAX:-2}
      JARVIS_AGENT_MODEL: ${JARVIS_AGENT_MODEL:-claude-sonnet-4-6}
      # Ciclo del idle (s): aviso, ritual de cierre (handoff) y cierre de la sesión.
      JARVIS_AGENT_IDLE_WARN: ${JARVIS_AGENT_IDLE_WARN:-2100}
      JARVIS_AGENT_HANDOFF_AT: ${JARVIS_AGENT_HANDOFF_AT:-2700}
      JARVIS_AGENT_IDLE_TTL: ${JARVIS_AGENT_IDLE_TTL:-3300}
      # Tope de trabajo por turno y espera al gestor antes de preguntar al usuario.
      JARVIS_AGENT_TURN_TIMEOUT: ${JARVIS_AGENT_TURN_TIMEOUT:-1800}
      JARVIS_AGENT_MANAGER_TIMEOUT: ${JARVIS_AGENT_MANAGER_TIMEOUT:-300}
      # Salvaguarda: con el uso de la ventana de la suscripción en este % o más,
      # no se lanzan agentes ni empiezan turnos (el margen queda para el usuario).
      JARVIS_AGENT_USAGE_LIMIT: ${JARVIS_AGENT_USAGE_LIMIT:-85}
      TZ: ${TZ:-Europe/Madrid}
    # Solo localhost: el núcleo (host-net) llega por 127.0.0.1.
    ports:
      - "127.0.0.1:${JARVIS_WORKER_PORT:-8113}:8113"
    volumes:
      - jarvis-worker-data:/data
    # Cada agente es un proceso del CLI (~0,35 GB) más lo que ejecute (tests…).
    mem_limit: ${JARVIS_WORKER_MEM_LIMIT:-4g}
    memswap_limit: ${JARVIS_WORKER_MEM_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8113/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  jarvis-models:
  jarvis-data:
  jarvis-worker-data:
