# === Plantilla: capacidad de workspace (estado de proyectos y notas por voz) ===
# Copiar como docker-compose.override.yml (no versionado: lleva rutas de la
# máquina). `docker compose` lo fusiona solo con docker-compose.yml.
# Además, definir JARVIS_WORKSPACE / JARVIS_GIT_ROOT / JARVIS_NOTES_REMOTE en el
# .env (ver .env.example).
services:
  jarvis:
    volumes:
      # Proyectos, solo lectura: PLAN.md, TODO y estado git de los working copies.
      - /ruta/a/tus/proyectos:/workspace:ro
      # Bare repos, solo lectura: actividad reciente de todos los equipos.
      - /ruta/a/bare-repos:/opt/git:ro
      # Único escribible: el remoto de las notas (push del Inbox).
      - /ruta/a/bare-repos/notes.git:/opt/git/notes.git

  # Worker de agentes (perfil "agents"). Los repos que pueden usar NO van aquí: son
  # los bare de JARVIS_AGENT_REPOS_DIR (docker-compose.yml los monta en /repos en el
  # worker y en el núcleo). Para dar uno de alta: scripts/agent_repo_setup.sh sobre
  # el bare y `mount --bind /ruta/a/bare-repos/mi-repo.git <JARVIS_AGENT_REPOS_DIR>/mi-repo.git`.
  jarvis-worker:
    volumes:
      # Opcional: reglas comunes de los agentes (bare con agents/CLAUDE.md y
      # rules/), solo lectura. El worker las clona antes de cada sesión.
      - /ruta/a/bare-repos/mi-config.git:/config.git:ro
